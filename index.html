<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebFxScan Shared Worker Demo</title>
    <script src="bootstrap.bundle.min.js"></script>
    <script src="jquery.3.6.4.js"></script>
    <script src="jquery.json-viewer.js"></script>
    <script src="main.js"></script>
    <link href="bootstrap.min.css" rel="stylesheet" />
    <link href="jquery.json-viewer.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body class="custom-scrollbar">
    <div class="vh-100 d-flex flex-column">
        <div class="custom-bg-header d-flex justify-content-start">
            <p class="m-0 p-3 h4 text-white">WebFxScan Shared Worker Demo</p>
        </div>
        <div class="container-fluid row flex-grow-1 p-0 m-0">
            <div class="custom-bg-sider col-3 p-3 d-flex flex-column">
                <form id="main-form" class="flex-grow-1 d-flex flex-column">
                    <div class="row mb-3">
                        <label for="device-name" class="fw-bold align-self-center m-0 col-6 form-label">Device Name</label>
                        <div class="col-6">
                            <select class="form-select" id="device-name"></select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label for="source" class="fw-bold align-self-center m-0 col-6 form-label">Source</label>
                        <div class="col-6">
                            <select class="form-select" id="source"></select>
                        </div>
                    </div>
                    <button id="scan" type="button" class="custom-button-scan text-white fw-bold btn w-100 mb-3">Scan</button>
                    
                    <div class="d-flex mb-1 justify-content-between">
                        <label class="m-0 align-self-center fw-bold form-label">Message</label>
                        <button id="clear-message" type="button" class="custom-button-clear fw-bold btn">Clear</button>
                    </div>
                    <div id="message-container" class="custom-card custom-scrollbar overflow-auto card flex-grow-1">
                        <div class="card-body">
                            <div id="log-container" class="accordion"></div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="col-9 d-flex flex-column p-0 m-0">
                <div class="custom-bg-content flex-grow-1 d-flex flex-column align-items-center justify-content-center">
                    <div class="page-navi-container d-flex p-2 gap-2">
                        <div id="page-prev" class="custom-arrow-button">&lt;</div>
                        <input type="number" id="current-page-input" value="0" />
                        / <span id="total-pages">0</span>
                        <div id="page-next" class="custom-arrow-button">&gt;</div>
                    </div>
                    <div class="custom-image-container p-3">
                        <img id="img-zone" style="max-width: 100%; max-height: 80vh;" />
                    </div>
                </div>
                <div class="p-2 text-end bg-light">
                    Version: <span id="version">Loading...</span>
                </div>
            </div>
        </div>
    </div>
    <div class="custom-loading-mask d-none"><div class="loader"></div></div>
</body>
</html>
